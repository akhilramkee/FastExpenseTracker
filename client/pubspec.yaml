name: client
description: Cross-Platform Asynchronous Expense Tracker Mobile Client
version: 1.0.0+1

publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  http: ^1.2.0
  uuid: ^4.3.3
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.2
  intl: ^0.19.0
  sqflite_common_ffi_web: ^1.1.2
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.3.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
  web:
    generate: true
    image_path: assets/icons/app_icon.png
    background_color: "#0F101A"
    theme_color: "#8B5CF6"
  image_path: assets/icons/app_icon.png
  adaptive_icon_background: "#0F101A"
  adaptive_icon_foreground: assets/icons/app_icon.png

flutter:
  uses-material-design: true
