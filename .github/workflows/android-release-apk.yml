name: Build Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build TapEx APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses

      - name: Resolve version name and code
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW="${GITHUB_REF#refs/tags/v}"
          else
            RAW="0.0.${GITHUB_RUN_NUMBER}"
          fi
          # Drop any pre-release/build metadata suffix (e.g. 1.2.0-beta+5 -> 1.2.0)
          CLEAN="${RAW%%-*}"
          CLEAN="${CLEAN%%+*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN"
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
          # Monotonic integer: keeps order across releases (minor/patch < 1000)
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          if [ "$VERSION_CODE" -le 0 ]; then
            VERSION_CODE="${GITHUB_RUN_NUMBER}"
          fi
          echo "version_name=${CLEAN}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Resolved versionName=${CLEAN} versionCode=${VERSION_CODE}"

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.version_name }}" \
            --build-number="${{ steps.version.outputs.version_code }}"

      - name: Prepare release filename
        id: apk
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="manual-${GITHUB_RUN_NUMBER}"
          fi
          APK_NAME="TapEx-${TAG}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "../${APK_NAME}"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_name }}
          retention-days: 90

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: TapEx ${{ github.ref_name }}
          files: ${{ steps.apk.outputs.apk_name }}
          generate_release_notes: true
